<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" rx="34" fill="#121214"/>
  <rect x="28" y="28" width="1144" height="574" rx="26" fill="#18181C" stroke="#2A2A2D"/>

  <text x="76" y="96" fill="#A1A1AA" font-size="22" font-family="JetBrains Mono, monospace">BisQue Ultra · research program</text>
  <text x="74" y="192" fill="#F5F5F5" font-size="64" font-family="Inter, sans-serif" font-weight="700">Evaluate the system</text>
  <text x="74" y="256" fill="#F5F5F5" font-size="64" font-family="Inter, sans-serif" font-weight="700">like a model</text>
  <text x="76" y="312" fill="#A1A1AA" font-size="26" font-family="Inter, sans-serif">A falsifiable theory of when orchestration wins — and a preregistered way to find out.</text>

  <!-- three linked nodes: coverage / compression / verification -->
  <g>
    <rect x="76" y="378" width="316" height="150" rx="22" fill="#202027" stroke="#34343C"/>
    <rect x="442" y="378" width="316" height="150" rx="22" fill="#202027" stroke="#34343C"/>
    <rect x="808" y="378" width="316" height="150" rx="22" fill="#202027" stroke="#34343C"/>
    <path d="M392 453 H442" stroke="#F5F5F5" stroke-width="8" stroke-linecap="round"/>
    <path d="M758 453 H808" stroke="#F5F5F5" stroke-width="8" stroke-linecap="round"/>
    <text x="104" y="440" fill="#F5F5F5" font-size="27" font-family="Inter, sans-serif" font-weight="600">Coverage</text>
    <text x="104" y="482" fill="#A1A1AA" font-size="19" font-family="Inter, sans-serif">enumerate every unit</text>
    <text x="470" y="440" fill="#F5F5F5" font-size="27" font-family="Inter, sans-serif" font-weight="600">Compression</text>
    <text x="470" y="482" fill="#A1A1AA" font-size="19" font-family="Inter, sans-serif">typed, sufficient results</text>
    <text x="836" y="440" fill="#F5F5F5" font-size="27" font-family="Inter, sans-serif" font-weight="600">Verification</text>
    <text x="836" y="482" fill="#A1A1AA" font-size="19" font-family="Inter, sans-serif">accept only on evidence</text>
  </g>
</svg>
